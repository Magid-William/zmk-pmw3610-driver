description: I2C trackpoint slave (Pro Mini emulator)

compatible: "promini,trackpoint-i2c"

include: i2c-device.yaml

properties:
  irq-gpios:
    type: phandle-array
  reset-gpios:
    type: phandle-array
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  speed-scale:
    type: int
    default: 255
    description: Speed scaling factor (1-255, 255 = 100%, 204 = 80%, 128 = 50%)
  curve-rate:
    type: int
    default: 0
    description: PowerCurve rate, Q8.8 fixed point (18 = 0.07). f(v) = start + (rate*v)^exp.
  curve-exponent:
    type: int
    default: 256
    description: PowerCurve exponent, Q8.8 fixed point (256 = 1.0).
  curve-start:
    type: int
    default: 256
    description: PowerCurve output offset (gain at v=0), Q8.8 fixed point (77 = 0.30).
