description: I2C trackpoint slave (Pro Mini emulator)

compatible: "promini,trackpoint-i2c"

include: i2c-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  reset-gpios:
    type: phandle-array
    required: true
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  divider:
    type: uint32
    default: 1
    description: Divide reported X/Y values by this factor (1 = no change, 2 = half speed, etc.)
