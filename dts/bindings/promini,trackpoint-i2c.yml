description: I2C trackpoint slave (Pro Mini emulator)

compatible: "promini,trackpoint-i2c"

include: i2c-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  reset-gpios:
    type: phandle-array
    required: true
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  speed-scale:
    type: int
    default: 255
    description: Speed scaling factor (1-255, 255 = 100%, 204 = 80%, 128 = 50%)
